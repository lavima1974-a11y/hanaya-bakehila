<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חנייה בקהילה 🚗</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="חנייה בקהילה">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202052.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3202/3202052.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Leaflet CSS & JS for Live Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    #map { height: 260px; width: 100%; border-radius: 1rem; z-index: 1; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 font-sans pb-12 transition-colors duration-200">

  <!-- Header -->
  <header class="bg-blue-600 dark:bg-blue-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🚗</span>
        <div>
          <h1 class="text-lg font-bold tracking-wide leading-tight">חנייה בקהילה</h1>
          <span id="active-count-badge" class="text-[11px] text-blue-200 font-medium">0 חניות פנויות</span>
        </div>
      </div>
      
      <!-- Quick Toggles -->
      <div class="flex items-center gap-2">
        <button id="sound-toggle" onclick="toggleSound()" class="p-2 bg-blue-700 dark:bg-blue-800 rounded-xl text-xs hover:bg-blue-800 transition" title="הפעל/כבה צליל התראה">
          🔔 <span id="sound-status-text" class="text-[10px]">פעיל</span>
        </button>
        <button onclick="toggleDarkMode()" class="p-2 bg-blue-700 dark:bg-blue-800 rounded-xl text-xs hover:bg-blue-800 transition" title="מצב לילה">
          🌙
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-5">

    <!-- Community Leaderboard Badge -->
    <div class="bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-2xl p-3.5 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🏆</span>
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-amber-100">אלופי הקהילה השבוע</h3>
          <p id="leaderboard-status" class="text-xs font-semibold">דווחת 0 חניות • צברת 0 נקודות!</p>
        </div>
      </div>
      <span class="bg-white/20 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">דרגה: שכן זהב 🌟</span>
    </div>

    <!-- Report Form Card -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-5 border border-slate-200/80 dark:border-slate-700">
      <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-3 flex items-center justify-between">
        <span class="flex items-center gap-2">📢 דווחי/דק על חנייה</span>
      </h2>
      
      <form id="parking-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">רחוב, מספר ועיר *</label>
          <div class="flex gap-2">
            <input type="text" id="location-input" placeholder="למשל: הרצל 15, באר שבע" required
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button type="button" onclick="useCurrentLocation()" id="gps-btn"
              class="bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 hover:bg-blue-200 font-semibold px-3 rounded-xl text-xs flex items-center gap-1 shrink-0 transition">
              📍 מיקום שלי
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">מתי החנייה מתפנה? 🕒</label>
          <select id="leaving-in-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium text-blue-700 dark:text-blue-300">
            <option value="0" selected>עכשיו! ⚡ (כבר פנויה)</option>
            <option value="5">בעוד 5 דקות ⏱️</option>
            <option value="10">בעוד 10 דקות ⏱️</option>
            <option value="15">בעוד 15 דקות ⏱️</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">סוג חנייה</label>
            <select id="type-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
              <option value="אפור ⚪">אפור ⚪ (חינם)</option>
              <option value="כחול-לבן 🔵">כחול-לבן 🔵</option>
              <option value="חניית נכים ♿">חניית נכים ♿</option>
              <option value="כללי 🚗">אחר / כללי</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">זמן תפוגת דיווח</label>
            <select id="duration-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
              <option value="5">5 דקות ⚡ (אזור עמוס)</option>
              <option value="10" selected>10 דקות ⏱️ (רגיל)</option>
              <option value="15">15 דקות ⏱️</option>
              <option value="30">30 דקות ⏳ (אזור שקט)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">הערה קצרה (אופציונלי)</label>
          <input type="text" id="notes-input" placeholder="למשל: מול המכולת, מתאימה לרכב קטן" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3 rounded-xl transition duration-150 shadow-md shadow-blue-500/20 text-sm">
          דווח לקהילה
        </button>
      </form>
    </div>

    <!-- Live Map Section -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-3 shadow-sm border border-slate-200/80 dark:border-slate-700 space-y-2">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
          <span>🗺️</span> מפת חניות בלייב
        </h2>
        <span class="text-[10px] text-slate-400">מראה חניות קרובות</span>
      </div>
      <div id="map"></div>
    </div>

    <!-- Active Parkings Header & Search -->
    <div class="space-y-3" id="parkings-section">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
          <span>📍</span> חניות פנויות כרגע:
        </h2>
        <span class="text-xs text-slate-400">ממוין לפי קירבה</span>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="search-input" placeholder="סינון לפי שם רחוב..."
          class="w-full pr-9 pl-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span class="absolute right-3 top-2.5 text-slate-400 text-xs">🔍</span>
      </div>
    </div>

    <!-- Parkings List Container -->
    <div id="parkings-list" class="space-y-3">
      <div class="text-center py-8 text-slate-400 text-sm animate-pulse">
        טוען חניות פנויות...
      </div>
    </div>

  </main>

  <!-- Firebase & App Script -->
  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForGithubPagesSetup12345",
      authDomain: "hanaya-bakehila.firebaseapp.com",
      projectId: "hanaya-bakehila",
      storageBucket: "hanaya-bakehila.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Elements
    const parkingForm = document.getElementById('parking-form');
    const locationInput = document.getElementById('location-input');
    const leavingInInput = document.getElementById('leaving-in-input');
    const typeInput = document.getElementById('type-input');
    const durationInput = document.getElementById('duration-input');
    const notesInput = document.getElementById('notes-input');
    const parkingsList = document.getElementById('parkings-list');
    const searchInput = document.getElementById('search-input');
    const activeCountBadge = document.getElementById('active-count-badge');
    const soundStatusText = document.getElementById('sound-status-text');
    const leaderboardStatus = document.getElementById('leaderboard-status');

    let allParkings = [];
    let map, mapMarkers = [];
    let userCoords = null;
    let isSoundEnabled = true;
    let isInitialLoad = true;
    let userReportsCount = parseInt(localStorage.getItem('userReportsCount') || '0');

    function updateLeaderboardUI() {
      const points = userReportsCount * 10;
      leaderboardStatus.textContent = `דווחת ${userReportsCount} חניות • צברת ${points} נקודות!`;
    }
    updateLeaderboardUI();

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // Sound Notification Toggle
    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      soundStatusText.textContent = isSoundEnabled ? "פעיל" : "כבוי";
    }

    function playNotificationSound() {
      if (!isSoundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // Initialize Leaflet Map
    function initMap() {
      map = L.map('map').setView([31.2529, 34.7915], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          map.setView([userCoords.lat, userCoords.lon], 14);
          L.circle([userCoords.lat, userCoords.lon], { radius: 100, color: '#2563eb' }).addTo(map);
          renderParkings();
        });
      }
    }
    initMap();

    // GPS Helper
    function useCurrentLocation() {
      const gpsBtn = document.getElementById('gps-btn');
      gpsBtn.textContent = '🔄 מאתר...';
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async pos => {
          userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userCoords.lat}&lon=${userCoords.lon}`);
            const data = await res.json();
            if (data && data.address) {
              const road = data.address.road || data.address.suburb || '';
              const city = data.address.city || data.address.town || '';
              locationInput.value = `${road} ${city}`.trim() || `${userCoords.lat.toFixed(4)}, ${userCoords.lon.toFixed(4)}`;
            }
          } catch (e) {
            locationInput.value = `${userCoords.lat.toFixed(4)}, ${userCoords.lon.toFixed(4)}`;
          }
          gpsBtn.textContent = '📍 מיקום שלי';
        }, () => {
          alert('לא ניתן לגשת למיקום המכשיר');
          gpsBtn.textContent = '📍 מיקום שלי';
        });
      }
    }

    // Distance Calculation (Meters)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // Geocoding Helper
    async function getCoordinates(address) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await response.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        }
      } catch (err) {
        console.error("Geocoding error:", err);
      }
      return null;
    }

    // Update Map Markers
    async function updateMapMarkers(parkings) {
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];
      let bounds = [];

      if (userCoords) {
        bounds.push([userCoords.lat, userCoords.lon]);
      }

      for (const p of parkings) {
        if (!p.coords) {
          p.coords = await getCoordinates(p.location);
        }
        if (p.coords) {
          const marker = L.marker([p.coords.lat, p.coords.lon]).addTo(map);
          marker.bindPopup(`
            <div dir="rtl" class="text-right">
              <b>📍 ${p.location}</b><br/>
              <span class="text-xs text-blue-600">${p.type || 'אפור'}</span><br/>
              <a href="https://waze.com/ul?q=${encodeURIComponent(p.location)}" target="_blank" class="text-xs text-sky-500 font-bold">🚙 פתח ב-Waze</a>
            </div>
          `);
          mapMarkers.push(marker);
          bounds.push([p.coords.lat, p.coords.lon]);
        }
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
      }
    }

    function formatTime(timestamp) {
      if (!timestamp) return 'מקודם';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    function isExpired(p) {
      if (!p.createdAt) return false;
      const createdDate = p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
      const leavingInMins = p.leavingInMinutes || 0;
      const durationMins = p.durationMinutes || 10;
      const totalLifetimeMins = leavingInMins + durationMins;
      const diffInMins = (new Date() - createdDate) / (1000 * 60);
      return diffInMins > totalLifetimeMins;
    }

    function getHoldRemainingSeconds(p) {
      if (p.status !== 'on_the_way' || !p.holdStartedAt) return 0;
      const date = p.holdStartedAt.toDate ? p.holdStartedAt.toDate() : new Date(p.holdStartedAt);
      const diffInSecs = Math.floor((new Date() - date) / 1000);
      const remainingSecs = 180 - diffInSecs;
      return remainingSecs > 0 ? remainingSecs : 0;
    }

    function getAvailableRemainingSeconds(p) {
      if (!p.createdAt || !p.leavingInMinutes) return 0;
      const createdDate = p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
      const availableDate = new Date(createdDate.getTime() + p.leavingInMinutes * 60000);
      const diffInSecs = Math.floor((availableDate - new Date()) / 1000);
      return diffInSecs > 0 ? diffInSecs : 0;
    }

    // Submit New Parking with Auto-Clear & Auto-Scroll
    parkingForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const location = locationInput.value.trim();
      const leavingIn = parseInt(leavingInInput.value) || 0;
      const type = typeInput.value;
      const duration = parseInt(durationInput.value) || 10;
      const notes = notesInput.value.trim();

      if (!location) return;

      try {
        await db.collection('parkings').add({
          location: location,
          leavingInMinutes: leavingIn,
          type: type,
          durationMinutes: duration,
          notes: notes,
          status: 'available',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Clear Form Fields
        locationInput.value = '';
        notesInput.value = '';
        leavingInInput.value = '0';

        // Update User Leaderboard Score
        userReportsCount++;
        localStorage.setItem('userReportsCount', userReportsCount.toString());
        updateLeaderboardUI();

        // Auto Scroll down to Parkings List
        document.getElementById('parkings-section').scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        console.error("שגיאה בדיווח:", err);
        alert("אירעה שגיאה בדיווח, אנא נסו שוב.");
      }
    });

    async function markOnTheWay(id) {
      try {
        await db.collection('parkings').doc(id).update({
          status: 'on_the_way',
          holdStartedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) { console.error(err); }
    }

    async function releaseHold(id) {
      try {
        await db.collection('parkings').doc(id).update({
          status: 'available',
          holdStartedAt: null
        });
      } catch (err) { console.error(err); }
    }

    async function markAsTaken(id) {
      try {
        await db.collection('parkings').doc(id).update({ status: 'taken' });
      } catch (err) { console.error(err); }
    }

    async function deleteParking(id) {
      try {
        await db.collection('parkings').doc(id).delete();
      } catch (err) { console.error(err); }
    }

    // Render Parkings Sorted by Distance
    function renderParkings() {
      const query = searchInput.value.trim().toLowerCase();
      
      let activeParkings = allParkings.filter(p => {
        const notTaken = p.status !== 'taken';
        const notExpired = !isExpired(p);
        const matchesSearch = !query || p.location.toLowerCase().includes(query);

        if (p.status === 'on_the_way' && getHoldRemainingSeconds(p) <= 0) {
          releaseHold(p.id);
        }

        return notTaken && notExpired && matchesSearch;
      });

      if (userCoords) {
        activeParkings.forEach(p => {
          if (p.coords) {
            p.distanceMeters = calculateDistance(userCoords.lat, userCoords.lon, p.coords.lat, p.coords.lon);
          }
        });
        activeParkings.sort((a, b) => (a.distanceMeters || 999999) - (b.distanceMeters || 999999));
      }

      activeCountBadge.textContent = `${activeParkings.length} חניות פנויות`;
      updateMapMarkers(activeParkings);

      if (activeParkings.length === 0) {
        parkingsList.innerHTML = `
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 text-center border border-slate-200 dark:border-slate-700">
            <div class="text-4xl mb-2">🅿️</div>
            <p class="font-bold text-slate-700 dark:text-slate-200">אין חניות פנויות כרגע</p>
            <p class="text-xs text-slate-400 mt-1">היו הראשונים לדווח על חנייה שמתפנה ברחוב שלכם!</p>
          </div>
        `;
        return;
      }

      parkingsList.innerHTML = activeParkings.map(p => {
        const timeStr = formatTime(p.createdAt);
        const wazeUrl = `https://waze.com/ul?q=${encodeURIComponent(p.location)}`;
        const isOnTheWay = p.status === 'on_the_way';
        const remainingHoldSecs = getHoldRemainingSeconds(p);
        const remainingUntilAvailable = getAvailableRemainingSeconds(p);

        const distText = p.distanceMeters ? ` • 📏 כ-${p.distanceMeters} מטר ממך` : '';

        const shareStatus = remainingUntilAvailable > 0 
          ? `⏳ מתפנה בעוד ${Math.ceil(remainingUntilAvailable / 60)} דקות` 
          : `🟢 פנויה עכשיו!`;
        const shareText = `🚗 *דיווח חנייה בקהילה!*\n📍 *מיקום:* ${p.location}\n🕒 *סטטוס:* ${shareStatus}\n🏷️ *סוג:* ${p.type || 'אפור'}\n${p.notes ? `💬 *הערה:* ${p.notes}\n` : ''}🔗 לפרטים נוספים: https://lavima1974-a11y.github.io/hanaya-bakehila/`;
        const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;

        const borderClass = isOnTheWay ? 'border-r-amber-500 bg-amber-50/30 dark:bg-amber-950/20' : 'border-r-emerald-500 bg-white dark:bg-slate-800';

        return `
          <div class="${borderClass} rounded-2xl p-4 shadow-sm border-r-4 border border-slate-200/80 dark:border-slate-700 space-y-3 transition">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base flex items-center gap-1.5">
                  <span>📍</span> ${p.location}
                </h3>
                <div class="flex items-center gap-2 mt-1 flex-wrap">
                  <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium">${p.type || 'אפור ⚪'}</span>
                  <span class="text-xs text-slate-400">⏱️ מ- ${timeStr}${distText}</span>
                </div>
              </div>
              <button onclick="deleteParking('${p.id}')" title="מחק דיווח" class="text-slate-300 dark:text-slate-600 hover:text-red-500 text-xs p-1">
                🗑️
              </button>
            </div>

            <div>
              ${remainingUntilAvailable > 0 ? `
                <div class="bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800 text-indigo-800 dark:text-indigo-300 rounded-xl px-3 py-1.5 text-xs font-semibold inline-flex items-center gap-1.5">
                  <span>⏳</span> מתפנה בעוד ${Math.floor(remainingUntilAvailable / 60)}:${(remainingUntilAvailable % 60).toString().padStart(2, '0')} דקות
                </div>
              ` : `
                <div class="bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 rounded-xl px-3 py-1.5 text-xs font-semibold inline-flex items-center gap-1.5">
                  <span>🟢</span> פנויה עכשיו!
                </div>
              `}
            </div>

            ${p.notes ? `<p class="text-xs text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-700/50 p-2 rounded-lg border border-slate-100 dark:border-slate-700">💬 ${p.notes}</p>` : ''}

            ${isOnTheWay ? `
              <div class="bg-amber-100/80 dark:bg-amber-900/40 border border-amber-200 dark:border-amber-800 rounded-xl p-2.5 flex items-center justify-between text-xs text-amber-900 dark:text-amber-200 font-medium">
                <span>🏃‍♂️ שכן בדרך לחנייה זו!</span>
                <span class="bg-amber-200 dark:bg-amber-800 px-2 py-0.5 rounded-md font-bold">שמור עוד ${Math.floor(remainingHoldSecs / 60)}:${(remainingHoldSecs % 60).toString().padStart(2, '0')} דק'</span>
              </div>
            ` : ''}

            <div class="space-y-2 pt-1">
              <div class="flex gap-2">
                ${!isOnTheWay ? `
                  <button onclick="markOnTheWay('${p.id}')" 
                    class="flex-1 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-bold py-2.5 px-2 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                    🏃‍♂️ אני בדרך! (3 דק')
                  </button>
                ` : `
                  <button onclick="releaseHold('${p.id}')" 
                    class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2.5 px-3 rounded-xl text-xs transition">
                    ↩️ בטל שמירה
                  </button>
                `}

                <button onclick="markAsTaken('${p.id}')" 
                  class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                  ✅ תפסתי!
                </button>
              </div>

              <div class="flex gap-2">
                <a href="${wazeUrl}" target="_blank"
                  class="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                  🚙 Waze
                </a>

                <a href="${whatsappUrl}" target="_blank"
                  class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                  💬 שתף בוואטסאפ
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderParkings);
    setInterval(renderParkings, 1000);

    // Firestore Live Listener
    db.collection('parkings')
      .orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        const previousCount = allParkings.length;
        
        allParkings = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        if (!isInitialLoad && allParkings.length > previousCount) {
          playNotificationSound();
        }
        isInitialLoad = false;

        renderParkings();
      }, (error) => {
        console.error("שגיאה בחיבור ל-Firestore:", error);
      });
  </script>
</body>
</html>
