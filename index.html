<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חנייה בקהילה 🚗</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="חנייה בקהילה">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202052.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3202/3202052.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🚗</span>
        <h1 class="text-xl font-bold tracking-wide">חנייה בקהילה</h1>
      </div>
      <span id="active-count-badge" class="bg-blue-800 text-xs px-2.5 py-1 rounded-full font-medium">0 חניות פנויות</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

    <!-- Report Form Card -->
    <div class="bg-white rounded-2xl shadow-sm p-5 border border-slate-200/80">
      <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
        <span>📢</span> דווחי/דק על חנייה שמתפנה
      </h2>
      
      <form id="parking-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">רחוב, מספר ועיר *</label>
          <input type="text" id="location-input" placeholder="למשל: הרצל 15, באר שבע" required
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">סוג חנייה</label>
            <select id="type-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
              <option value="אפור ⚪">אפור ⚪ (חינם)</option>
              <option value="כחול-לבן 🔵">כחול-לבן 🔵</option>
              <option value="חניית נכים ♿">חניית נכים ♿</option>
              <option value="כללי 🚗">אחר / כללי</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">תפוגת דיווח</label>
            <select id="duration-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white font-medium text-blue-700">
              <option value="5">5 דקות ⚡ (אזור עמוס/ת"א)</option>
              <option value="10" selected>10 דקות ⏱️ (רגיל)</option>
              <option value="15">15 דקות ⏱️</option>
              <option value="30">30 דקות ⏳ (אזור שקט)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">הערה קצרה (אופציונלי)</label>
          <input type="text" id="notes-input" placeholder="למשל: מתפנה בעוד 2 דק', מתאימה לרכב קטן" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3 rounded-xl transition duration-150 shadow-md shadow-blue-500/20 text-sm">
          דווח לקהילה
        </button>
      </form>
    </div>

    <!-- Active Parkings Header & Search -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <span>📍</span> חניות פנויות כרגע:
        </h2>
        <span class="text-xs text-slate-400">תפוגה אוטומטית לפי הגדרה</span>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="search-input" placeholder="סינון לפי שם רחוב..."
          class="w-full pr-9 pl-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        <span class="absolute right-3 top-2.5 text-slate-400 text-xs">🔍</span>
      </div>
    </div>

    <!-- Parkings List Container -->
    <div id="parkings-list" class="space-y-3">
      <!-- Loading State -->
      <div class="text-center py-8 text-slate-400 text-sm animate-pulse">
        טוען חניות פנויות...
      </div>
    </div>

  </main>

  <!-- Firebase & App Script -->
  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForGithubPagesSetup12345",
      authDomain: "hanaya-bakehila.firebaseapp.com",
      projectId: "hanaya-bakehila",
      storageBucket: "hanaya-bakehila.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // DOM Elements
    const parkingForm = document.getElementById('parking-form');
    const locationInput = document.getElementById('location-input');
    const typeInput = document.getElementById('type-input');
    const durationInput = document.getElementById('duration-input');
    const notesInput = document.getElementById('notes-input');
    const parkingsList = document.getElementById('parkings-list');
    const searchInput = document.getElementById('search-input');
    const activeCountBadge = document.getElementById('active-count-badge');

    let allParkings = [];

    // Helper: Format Time
    function formatTime(timestamp) {
      if (!timestamp) return 'מקודם';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    // Helper: Check if parking is expired
    function isExpired(p) {
      if (!p.createdAt) return false;
      const date = p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
      const diffInMins = (new Date() - date) / (1000 * 60);
      const maxMins = p.durationMinutes || 10;
      return diffInMins > maxMins;
    }

    // Helper: Check hold countdown (3 mins max)
    function getHoldRemainingSeconds(p) {
      if (p.status !== 'on_the_way' || !p.holdStartedAt) return 0;
      const date = p.holdStartedAt.toDate ? p.holdStartedAt.toDate() : new Date(p.holdStartedAt);
      const diffInSecs = Math.floor((new Date() - date) / 1000);
      const remainingSecs = 180 - diffInSecs; // 3 minutes = 180s
      return remainingSecs > 0 ? remainingSecs : 0;
    }

    // 2. Submit New Parking
    parkingForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const location = locationInput.value.trim();
      const type = typeInput.value;
      const duration = parseInt(durationInput.value) || 10;
      const notes = notesInput.value.trim();

      if (!location) return;

      try {
        await db.collection('parkings').add({
          location: location,
          type: type,
          durationMinutes: duration,
          notes: notes,
          status: 'available',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        locationInput.value = '';
        notesInput.value = '';
      } catch (err) {
        console.error("שגיאה בדיווח:", err);
        alert("אירעה שגיאה בדיווח, אנא נסו שוב.");
      }
    });

    // 3. Set Status: On The Way (Hold for 3 minutes)
    async function markOnTheWay(id) {
      try {
        await db.collection('parkings').doc(id).update({
          status: 'on_the_way',
          holdStartedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        console.error("שגיאה בעדכון 'אני בדרך':", err);
      }
    }

    // Cancel Hold / Release back to available
    async function releaseHold(id) {
      try {
        await db.collection('parkings').doc(id).update({
          status: 'available',
          holdStartedAt: null
        });
      } catch (err) {
        console.error("שגיאה בביטול שריין:", err);
      }
    }

    // Mark as Taken
    async function markAsTaken(id) {
      try {
        await db.collection('parkings').doc(id).update({
          status: 'taken'
        });
      } catch (err) {
        console.error("שגיאה בעדכון חנייה:", err);
      }
    }

    // 4. Delete Parking
    async function deleteParking(id) {
      try {
        await db.collection('parkings').doc(id).delete();
      } catch (err) {
        console.error("שגיאה במחיקת חנייה:", err);
      }
    }

    // 5. Render Parkings
    function renderParkings() {
      const query = searchInput.value.trim().toLowerCase();
      
      const activeParkings = allParkings.filter(p => {
        const notTaken = p.status !== 'taken';
        const notExpired = !isExpired(p);
        const matchesSearch = !query || p.location.toLowerCase().includes(query);

        // Check if hold expired automatically
        if (p.status === 'on_the_way' && getHoldRemainingSeconds(p) <= 0) {
          releaseHold(p.id);
        }

        return notTaken && notExpired && matchesSearch;
      });

      activeCountBadge.textContent = `${activeParkings.length} חניות פנויות`;

      if (activeParkings.length === 0) {
        parkingsList.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
            <div class="text-4xl mb-2">🅿️</div>
            <p class="font-bold text-slate-700">אין חניות פנויות כרגע</p>
            <p class="text-xs text-slate-400 mt-1">היו הראשונים לדווח על חנייה שמתפנה ברחוב שלכם!</p>
          </div>
        `;
        return;
      }

      parkingsList.innerHTML = activeParkings.map(p => {
        const timeStr = formatTime(p.createdAt);
        const duration = p.durationMinutes || 10;
        const wazeUrl = `https://waze.com/ul?q=${encodeURIComponent(p.location)}`;
        const isOnTheWay = p.status === 'on_the_way';
        const remainingHoldSecs = getHoldRemainingSeconds(p);

        // Status Card Border Color
        const borderClass = isOnTheWay ? 'border-r-amber-500 bg-amber-50/30' : 'border-r-emerald-500 bg-white';

        return `
          <div class="${borderClass} rounded-2xl p-4 shadow-sm border-r-4 border border-slate-200/80 space-y-3 transition">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-1.5">
                  <span>📍</span> ${p.location}
                </h3>
                <div class="flex items-center gap-2 mt-1 flex-wrap">
                  <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-medium">${p.type || 'אפור ⚪'}</span>
                  <span class="text-xs text-slate-400">⏱️ מ- ${timeStr} (תפוגה: ${duration} דק')</span>
                </div>
              </div>
              <button onclick="deleteParking('${p.id}')" title="מחק דיווח" class="text-slate-300 hover:text-red-500 text-xs p-1">
                🗑️
              </button>
            </div>

            ${p.notes ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">💬 ${p.notes}</p>` : ''}

            ${isOnTheWay ? `
              <!-- On The Way Status Banner -->
              <div class="bg-amber-100/80 border border-amber-200 rounded-xl p-2.5 flex items-center justify-between text-xs text-amber-900 font-medium">
                <span>🏃‍♂️ שכן בדרך לחנייה זו!</span>
                <span class="bg-amber-200 px-2 py-0.5 rounded-md font-bold">שמור עוד ${Math.floor(remainingHoldSecs / 60)}:${(remainingHoldSecs % 60).toString().padStart(2, '0')} דק'</span>
              </div>
            ` : ''}

            <div class="flex flex-wrap gap-2 pt-1">
              ${!isOnTheWay ? `
                <button onclick="markOnTheWay('${p.id}')" 
                  class="flex-1 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                  🏃‍♂️ אני בדרך! (שמור 3 דק')
                </button>
              ` : `
                <button onclick="releaseHold('${p.id}')" 
                  class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 px-3 rounded-xl text-xs transition">
                  ↩️ בטל שמירה
                </button>
              `}

              <button onclick="markAsTaken('${p.id}')" 
                class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                ✅ הגעתי ותפסתי!
              </button>

              <a href="${wazeUrl}" target="_blank"
                class="bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-sm">
                🚙 Waze
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Search Listener
    searchInput.addEventListener('input', renderParkings);

    // Refresh timers every second for countdown
    setInterval(renderParkings, 1000);

    // 6. Listen to Firestore Realtime Updates
    db.collection('parkings')
      .orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        allParkings = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderParkings();
      }, (error) => {
        console.error("שגיאה בחיבור ל-Firestore:", error);
      });
  </script>
</body>
</html>
